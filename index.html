<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>SAS | Digital Business Card</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23667eea;stop-opacity:1' /><stop offset='100%25' style='stop-color:%23764ba2;stop-opacity:1' /></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23grad)'/><text x='50' y='70' font-family='Arial, sans-serif' font-size='60' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(15px, 4vw, 30px);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: clamp(20px, 5vw, 30px);
            padding: clamp(30px, 6vw, 50px) clamp(25px, 5vw, 40px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(102, 126, 234, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.03) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: clamp(120px, 25vw, 150px);
            height: clamp(120px, 25vw, 150px);
            margin: 0 auto clamp(20px, 4vw, 30px);
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(36px, 8vw, 48px);
            font-weight: 800;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); }
            50% { box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5); }
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(24px, 6vw, 36px);
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: clamp(8px, 2vw, 12px);
            line-height: 1.3;
        }

        .title {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: clamp(15px, 3vw, 20px);
            font-weight: 600;
        }

        .email {
            text-align: center;
            margin-bottom: clamp(20px, 4vw, 30px);
        }

        .email a {
            color: #9ca3af;
            text-decoration: none;
            font-size: clamp(12px, 3vw, 14px);
            padding: clamp(8px, 2vw, 10px) clamp(16px, 4vw, 20px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .email a:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
            color: #c4b5fd;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: clamp(20px, 4vw, 30px) 0;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(10px, 2.5vw, 15px);
            margin-bottom: clamp(20px, 4vw, 30px);
        }

        .social-link {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: clamp(12px, 3vw, 16px);
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1.5vw, 10px);
            transition: all 0.3s ease;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 500;
        }

        .social-link:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .social-link i {
            font-size: clamp(20px, 5vw, 26px);
        }

        .btn {
            width: 100%;
            padding: clamp(14px, 3.5vw, 18px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(14px, 3.5vw, 16px);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            margin-bottom: clamp(12px, 3vw, 15px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .btn-outline {
            background: transparent;
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .footer {
            text-align: center;
            margin-top: clamp(20px, 4vw, 30px);
            color: #6b7280;
            font-size: clamp(11px, 2.5vw, 12px);
            opacity: 0.7;
        }

        /* Responsive - Single column on very small screens */
        @media (max-width: 360px) {
            .social-grid {
                grid-template-columns: 1fr;
            }
            
            .social-link {
                flex-direction: row;
                justify-content: flex-start;
                padding: 12px 16px;
            }
        }

        /* Landscape mobile optimization */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 15px;
            }
            
            .card-container {
                padding: 20px;
            }
            
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 28px;
                margin-bottom: 15px;
            }
            
            .social-grid {
                gap: 8px;
            }
            
            .btn {
                padding: 12px;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
    </style>
</head>

</body>
</html>
